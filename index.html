<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="pt-br">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link  rel="icon" href="culturama-favico.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">

    <title>Pesquisa Culturama</title>
</head>

<body>
    <main>
        <header>
        <img src="img/logo-culturama.png" alt="Logo culturama">
        <h1>Pesquisa Online</h1>
        </header>
        <section>
        <form action="" method="get">
            <fieldset>                
                 <legend>Dados Pessoais</legend>
                <label for="name">Nome Completo:</label>
                <input id="name" type="text" name="userName" placeholder="Digite seu nome completo" required>
                <br>
                <label for="age">Idade:</label>
                <input id="age" type="number" name="userAge" min=12 max=100 required>
                <br>
                <label for="birthDate">Data de Nascimento:</label>
                <input id="birthDate" type="date" name="userbirthDate">
                <br>
                <label for="email">Email:</label>
                <input id="email" type="email" name="userEmail" placeholder="Digite seu email" required>
                <br>
                <label for="phoneNumber">Telefone</label>
                <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="Digite seu número de telefone com DDD">
                <br>
                <label for="image">Upload de fotos</label>
                <input id="image" type="file" accept="image/*" name="userImage">
            </fieldset> 

            <fieldset>
                <legend>Perfil</legend>
                <p>Gênero:</p>
                <input id="fem" type="radio" name="userGender" value="Feminino">
                <label for="fem">Feminino</label>

                <input id="masc" type="radio" name="userGender" value="Masculino">
                <label for="masc">Masculino</label>

                <input id="notInformed" type="radio" name="userGender" value="notInformed">
                <label for="notInformed">Prefiro não informar</label>
                <br>

                <label for="maritalStatus">Estado Civil:</label>
                <select id="maritalStatus" name="userMaritalStatus">
                    <option value="notInformed">Selecione...</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="uniaoEstavel">União Estável</option>
                </select>

                <label for="state">Estado:</label>
                <select id="state" name="userState" required>
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="distritoFederal">Distrito Federal</option>
                    <option value="espiritoSanto">Espirito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão</option>
                    <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                    <option value="matoGrosso">Mato Grosso</option>
                    <option value="minasGerais">Minas Gerais</option>
                    <option value="para">Pará</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="parana">Paraná</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="piaui">Piauí</option>
                    <option value="rioDeJaneiro">Rio de Janeiro</option>
                    <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                    <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                    <option value="rondonia">Rondônia</option>
                    <option value="roraima">Roraima</option>
                    <option value="santaCatarina">Santa Catarina</option>
                    <option value="saoPaulo">São Paulo</option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>
                </select>
                <br>
                <label for="city">Cidade:</label>
                <input type="text" id="city" name="userCity" autocomplete="address-level2" placeholder="Digite sua cidade">
                <br>
            </fieldset>

            <fieldset>
                <legend>Hábitos:</legend>
                <p>Redes Sociais:</p>            
                <input id="instagram" type="checkbox" name="social" value="instagram">
                <label for="instagram">Instagram</label>
                <br>
                <input id="facebook" type="checkbox" name="social" value="facebook">
                <label for="facebook">Facebook</label>
                <br>
                <input id="twitter" type="checkbox" name="social" value="twitter">
                <label for="twitter">Twitter</label>
                <br>
                <input id="linkedin" type="checkbox" name="social" value="Linkedin">
                <label for="linkedin">LinkedIn</label>
                <br>
                <label for="musicStyle">Estilo musical</label>
                <input list="styleTypes" id="musicStyle" name="userMusicStyle" type="text">
                <datalist id="styleTypes">
                    <option value="Rock">
                    <option value="Pop">
                    <option value="Hip Hop">
                    <option value="Eletrônica">
                    <option value="Samba">
                    <option value="Sertanejo">
                    <option value="Forró">
                    <option value="Pagode">
                    <option value="Funk">
                </datalist>
                <br>
                <label for="favoriteColor">Cor favorita:</label><br>
                <input type="color" id="favoriteColor" name="userFavoriteColor">
            </fieldset>

            <fieldset>
                <legend>Opinião</legend>
                <p>O que você acha da qualidade do nosso serviço?</p>

                <input type="radio" id="otimo" name="userServiceOpinion" value="otima">
                <label for="otimo">Ótima</label><br>

                <input type="radio" id="boa" name="userServiceOpinion" value="boa">
                <label for="boa">Boa</label><br>

                <input type="radio" id="regular" name="userServiceOpinion" value="regular">
                <label for="regular">Regular</label><br>

                <input type="radio" id="ruim" name="userServiceOpinion" value="ruim">
                <label for="ruim">Ruim</label><br>

                <label for="comment">Escreva sua opinião:</label><br>
                <textarea id="comment" name="userComment" rows="4" cols="50" placeholder="Digite aqui..."></textarea>
            </fieldset>

            <fieldset>
                <legend>Confirmações:</legend>
                <input type="checkbox" id="userLgpd" name="userLgpdTerm" value="accepted" required>
                <label for="userLgpdTerm">Eu aceito participar da pesquisa</label>
                <br>
                <input type="checkbox" id="getResult" name="userGetResult" value="accepted">
                <label for="userGetResult">Desejo receber o resultado por email</label>
            </fieldset>

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>

            <br>

            <br>
        </form>
        </section>
    </main>

    
    
</body>
</html>
